<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <title>lunaci</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="lunaci">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Сайдбар -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <span class="logo-icon">L</span>
        <span class="logo-text">lunaci</span>
      </div>
      <nav class="nav" id="nav">
        <a href="#" class="nav-item active" data-view="home"><span class="nav-icon">🏠 </span><span>Главная</span></a>
        <a href="#" class="nav-item" data-view="my"><span class="nav-icon">❤️ </span><span>Моя музыка</span></a>
        <a href="#" class="nav-item" data-view="playlists"><span class="nav-icon">📁 </span><span>Плейлисты</span></a>
        <a href="#" class="nav-item" data-view="import"><span class="nav-icon">📥 </span><span>Импорт</span></a>
        <a href="#" class="nav-item" data-view="settings"><span class="nav-icon">⚙️ </span><span>Настройки</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="status" id="status">● Онлайн</div>
      </div>
    </aside>

    <!-- Основной контент -->
    <main class="main">
      <header class="topbar">
        <button class="burger" id="burger" aria-label="Меню">☰</button>
        <div class="search">
          <span class="search-icon">🔍 </span>
          <input type="search" id="search" placeholder="Поиск по трекам и исполнителям" autocomplete="off">
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Плеер -->
  <footer class="player">
    <div class="player-info">
      <div class="player-cover" id="playerCover">♪</div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle">Ничего не играет</div>
        <div class="player-artist" id="playerArtist">—</div>
      </div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button id="shuffleBtn" class="ctrl" title="Перемешать">🔀 </button>
        <button id="prevBtn" class="ctrl" title="Предыдущий">⏮</button>
        <button id="playBtn" class="ctrl play" title="Играть">▶</button>
        <button id="nextBtn" class="ctrl" title="Следующий">⏭</button>
        <button id="repeatBtn" class="ctrl" title="Повтор">🔁 </button>
      </div>
      <div class="player-progress">
        <span id="currentTime">0:00</span>
        <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="player-volume">
      <span>🔊 </span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>
    <audio id="audio" preload="metadata"></audio>
  </footer>

  <div class="toast-container" id="toastContainer"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
